<style>
/* layout: one column run sheet, sticky progress strip, sections per role like stations on a grill line */
:root{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
h1{font:600 28px/1.2 var(--display);margin:0;text-wrap:balance}

.lead{color:var(--muted);margin:8px 0 0;max-width:62ch}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:12px;border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:12px}

.sync{font-size:13px;color:var(--muted);margin-top:8px}
section{margin-top:28px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh h2{font:600 20px/1.3 var(--display);margin:0}
.sh .who{font-size:13px;color:var(--muted)}
.sh .cnt{margin-left:auto;font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.sh .cnt.full{color:var(--ok)}
.intro{color:var(--muted);font-size:14px;margin:4px 0 10px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:28px 1fr;gap:4px 12px}
li.done{border-color:var(--ok);background:var(--ok-soft)}
li.issue{border-color:var(--warn)}
.ck{width:26px;height:26px;border:2px solid var(--muted);border-radius:7px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ok);font-weight:700;padding:0}
li.done .ck{border-color:var(--ok);background:var(--card)}
.ck:focus-visible,.chips button:focus-visible,.ln:focus-visible,.tools button:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
.tx{min-width:0}
.tx b{font-weight:600}
.pass{font-size:14px;color:var(--muted);margin-top:2px}
.pass::before{content:"ผ่านถ้า: ";color:var(--ok);font-weight:600}
.ln{grid-column:2;justify-self:start;background:none;border:none;color:var(--chili);font:500 13px var(--body);padding:2px 0;cursor:pointer}
li.issue .ln{color:var(--warn)}
textarea{grid-column:1/-1;width:100%;min-height:64px;font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:32px}

pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>

<div class="wrap">

</div>

const ALL = SECTIONS.flatMap(s => s.items.map(([id]) => id));
let state = {};            // id -> {done, note}
let filter = 'all', openNote = new Set(), mode = 'local', db = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function loadLocal(){ try { state = JSON.parse(localStorage.getItem('maila-rehearsal') || '{}') || {}; } catch(e){ state = {}; } }
function saveLocal(){ try { localStorage.setItem('maila-rehearsal', JSON.stringify(state)); } catch(e){} }
async function put(id){
  const v = state[id] || {done:false, note:''};
  if (mode === 'shared') { try { await db.collection('checks').doc(id).set({done: !!v.done, note: String(v.note || '').slice(0, 500), at: new Date().toISOString()}); } catch(e){ toast('บันทึกไม่สำเร็จ ลองอีกครั้ง'); } }
  else saveLocal();
}

function render(){
  const done = ALL.filter(id => state[id] && state[id].done).length;
  $('bar').style.width = (done / ALL.length * 100) + '%';
  $('pct').textContent = `${done}/${ALL.length}`;
  $('chips').innerHTML = [['all','ทั้งหมด'], ...SECTIONS.map(s => [s.id, s.name])].map(([k, t]) => `<button data-f="${k}" aria-pressed="${filter === k}">${t}</button>`).join('');
  const focus = document.activeElement && document.activeElement.tagName === 'TEXTAREA' ? document.activeElement.id : null;
  $('list').innerHTML = SECTIONS.filter(s => filter === 'all' || s.id === filter).map(s => {
    const n = s.items.filter(([id]) => state[id] && state[id].done).length;
    return `<section><div class="sh"><h2>${s.name}</h2><span class="who">${s.who}</span><span class="cnt ${n === s.items.length ? 'full' : ''}">${n}/${s.items.length}</span></div>
      ${s.intro ? `<p class="intro">${s.intro}</p>` : ''}
      <ul>${s.items.map(([id, t, pass]) => { const v = state[id] || {}, note = v.note || '', open = openNote.has(id) || note;
        return `<li class="${v.done ? 'done' : ''} ${note ? 'issue' : ''}">
          <button class="ck" data-ck="${id}" aria-pressed="${!!v.done}" aria-label="${esc(t)}">${v.done ? '✓' : ''}</button>
          <div class="tx"><b>${esc(t)}</b><div class="pass">${esc(pass)}</div></div>
          ${open ? `<textarea id="n-${id}" data-note="${id}" placeholder="เกิดอะไรขึ้น อยู่หน้าไหน ใช้เครื่องอะไร">${esc(note)}</textarea>`
                 : `<button class="ln" data-open="${id}">+ จดปัญหา</button>`}
        </li>`; }).join('')}</ul></section>`;
  }).join('');
  if (focus && $(focus)) { const el = $(focus); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function summary(){
  const done = ALL.filter(id => state[id] && state[id].done).length, lines = [`ผลซ้อมเปิดร้านไม้ละ: ผ่าน ${done}/${ALL.length} ข้อ`];
  SECTIONS.forEach(s => {
    const rows = s.items.filter(([id]) => !(state[id] && state[id].done) || (state[id] && state[id].note));
    if (!rows.length) return;
    lines.push('', `[${s.name}]`);
    rows.forEach(([id, t]) => { const v = state[id] || {}; lines.push(`${v.done ? '✓' : '✗'} ${t}${v.note ? ' — ' + v.note.trim() : ''}`); });
  });
  return lines.join('\n');
}
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2200); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { filter = b.dataset.f; render(); }
  else if (b.dataset.ck) { const id = b.dataset.ck, v = state[id] || (state[id] = {done:false, note:''}); v.done = !v.done; render(); put(id); }
  else if (b.dataset.open) { openNote.add(b.dataset.open); render(); const t = $('n-' + b.dataset.open); if (t) t.focus(); }
  else if (b.id === 'copy') {
    const txt = summary(); $('out').textContent = txt; $('out').hidden = false;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('เลือกข้อความไว้แล้ว กดคัดลอกเองได้เลย'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('คัดลอกแล้ว วางใน LINE หรือแชตได้เลย'), fallback); } catch(err){ fallback(); }
  }
  else if (b.id === 'reset') $('confirm').innerHTML = `<div class="confirm"><span>ล้างติ๊กและหมายเหตุทั้งหมด${mode === 'shared' ? ' ของทั้งทีม' : ''}?</span><button class="del" id="reset-yes">ล้างเลย</button><button id="reset-no">ยกเลิก</button></div>`;
  else if (b.id === 'reset-no') $('confirm').innerHTML = '';
  else if (b.id === 'reset-yes') { const ids = Object.keys(state); state = {}; openNote.clear(); $('confirm').innerHTML = ''; $('out').hidden = true; render();
    if (mode === 'shared') ids.forEach(id => db.collection('checks').doc(id).delete().catch(() => {})); else saveLocal(); toast('เริ่มใหม่แล้ว'); }
});
let noteT = {};
document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.note; if (!id) return;
  const v = state[id] || (state[id] = {done:false, note:''}); v.note = e.target.value;
  clearTimeout(noteT[id]); noteT[id] = setTimeout(() => put(id), 700);
});
document.addEventListener('focusout', e => { const id = e.target.dataset && e.target.dataset.note; if (id && !(state[id] && state[id].note)) { openNote.delete(id); setTimeout(render, 0); } });

loadLocal(); render();
$('sync').textContent = 'บันทึกไว้ในเครื่องนี้ (แต่ละเครื่องติ๊กแยกกัน)';
(async () => {
  try {
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) return;
    mode = 'shared';
    $('sync').textContent = '● บันทึกร่วมกันทั้งทีม ใครติ๊กทุกคนเห็นพร้อมกัน';
    db.collection('checks').onSnapshot(snap => {
      const next = {}; snap.docs.forEach(d => { const x = d.data() || {}; next[d.id] = {done: !!x.done, note: String(x.note || '')}; });
      // keep a note the viewer is typing right now
      const a = document.activeElement; if (a && a.dataset && a.dataset.note && state[a.dataset.note]) next[a.dataset.note] = {...(next[a.dataset.note] || {done:false}), note: state[a.dataset.note].note};
      state = next; render();
    }, () => { mode = 'local'; loadLocal(); $('sync').textContent = 'เชื่อมต่อไม่ได้ บันทึกไว้ในเครื่องนี้แทน'; render(); });
  } catch(e){ mode = 'local'; }
})();
</script>
</body></html>
